<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Dashboard | MediFlow</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="dashboard-body">
    <div class="app-layout">
        
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo-container">
                    <span class="logo-icon">⚕️</span>
                    <span class="logo-text">MediFlow</span>
                </div>
                <button id="toggle-sidebar" class="icon-btn">☰</button>
            </div>
            <nav class="sidebar-nav">
                <a href="doctor.html" class="active">
                    <span class="nav-icon">🩺</span> <span class="nav-text">Doctor</span>
                </a>
                <a href="index.html">
                    <span class="nav-icon">🚪</span> <span class="nav-text">Sign Out</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <h1>Doctor Dashboard</h1>
                <div class="user-profile">
                    <div class="avatar">DR</div>
                    <span>Dr. Smith</span>
                </div>
            </header>

            <div class="dashboard-grid">
                
                <!-- Left: Patient Queue -->
                <div class="card queue-list-card">
                    <h3>Waiting Queue</h3>
                    <div id="doctor-queue" class="queue-list">
                        <!-- Populated by JS -->
                    </div>
                </div>

                <!-- Right: Active Consultation & Prescription -->
                <div class="card active-patient-card">
                    <div class="card-header-flex">
                        <h3>Current Consultation</h3>
                        <span id="active-token" class="badge waiting">No Patient Selected</span>
                    </div>
                    
                    <!-- Patient Details -->
                    <div id="patient-details" class="patient-details-grid">
                        <div class="detail-box"><strong>Name:</strong> <span id="p-name">--</span></div>
                        <div class="detail-box"><strong>Age/Sex:</strong> <span id="p-demographics">--</span></div>
                        <div class="detail-box"><strong>History:</strong> <span id="p-history">--</span></div>
                    </div>

                    <!-- Vitals -->
                    <div class="vitals-grid">
                        <div class="vital-box">🌡️ Temp: <span id="v-temp">--</span></div>
                        <div class="vital-box">❤️ BP: <span id="v-bp">--</span></div>
                        <div class="vital-box">🫁 SpO2: <span id="v-spo2">--</span></div>
                    </div>

                    <!-- Consultation Form -->
                    <form id="prescription-form" style="margin-top: 24px;">
                        <div class="form-group">
                            <label for="clinical-notes">Clinical Notes</label>
                            <textarea id="clinical-notes" rows="3" placeholder="Enter symptoms and observations..." required disabled></textarea>
                        </div>
                        <div class="form-group">
                            <label for="medicines">Digital Prescription</label>
                            <textarea id="medicines" rows="4" placeholder="e.g. Paracetamol 500mg - 1 tablet - Twice a day" required disabled></textarea>
                        </div>
                        <button type="submit" class="btn-primary" id="btn-prescribe" disabled>Submit & Send to Pharmacy</button>
                    </form>
                </div>

            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
