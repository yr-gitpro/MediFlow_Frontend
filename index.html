<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediFlow | Healthcare Management</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-body">
    <div class="login-container">
        
        <!-- LOGIN VIEW -->
        <div class="login-card" id="login-view">
            <div class="login-header">
                <div class="logo"><span class="logo-icon">⚕️</span> MediFlow</div>
                <h2>Welcome Back</h2>
                <p>Sign in to your dashboard</p>
            </div>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="name@domain.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <div class="form-group">
                    <label for="role">Select Portal</label>
                    <select id="role" required>
                        <option value="patient">Patient Dashboard</option>
                        <option value="reception">Reception Dashboard</option>
                        <option value="doctor">Doctor Dashboard</option>
                        <option value="pharmacy">Pharmacy Dashboard</option>
                        <option value="billing">Billing Dashboard</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary">Sign In</button>
            </form>

            <div class="switch-form">
                <p>New Patient? <a href="#" id="show-register">Create an account</a></p>
                <small class="confidential-note">*Staff accounts (Doctor, Reception, Pharmacy) are confidential and issued via internal email.</small>
            </div>
        </div>

        <!-- PATIENT REGISTRATION VIEW -->
        <div class="login-card" id="register-view" style="display: none;">
            <div class="login-header">
                <div class="logo"><span class="logo-icon">⚕️</span> MediFlow</div>
                <h2>Patient Registration</h2>
                <p>Create your personal health account</p>
            </div>
            
            <form id="register-form">
                <div class="form-group">
                    <label for="reg-name">Full Name</label>
                    <input type="text" id="reg-name" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label for="reg-email">Email Address</label>
                    <input type="email" id="reg-email" placeholder="john@example.com" required>
                </div>
                <div class="form-group">
                    <label for="reg-phone">Mobile Number</label>
                    <input type="tel" id="reg-phone" placeholder="10-digit mobile number" pattern="[0-9]{10}" maxlength="10" title="Please enter exactly 10 digits" required>
                </div>
                <div class="form-group">
                    <label for="reg-password">Create Password</label>
                    <input type="password" id="reg-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary">Register Account</button>
            </form>

            <div class="switch-form">
                <p>Already have an account? <a href="#" id="show-login">Sign In here</a></p>
            </div>
        </div>

    </div>
    
    <script src="app.js"></script>
</body>
</html>
