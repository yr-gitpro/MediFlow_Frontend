<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billing | MediFlow</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="dashboard-body">
    <div class="app-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo-container">
                    <span class="logo-icon">⚕️</span><span class="logo-text">MediFlow</span>
                </div>
                <button id="toggle-sidebar" class="icon-btn">☰</button>
            </div>
            <nav class="sidebar-nav">
                <a href="billing.html" class="active"><span class="nav-icon">💳</span> <span class="nav-text">Billing</span></a>
                <a href="index.html"><span class="nav-icon">🚪</span> <span class="nav-text">Sign Out</span></a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <h1>Clinic Billing</h1>
                <div class="user-profile"><div class="avatar">BL</div><span>Billing Dept</span></div>
            </header>

            <div class="dashboard-grid">
                <div class="card stats-card">
                    <h3>Today's Revenue</h3>
                    <p class="stat-number highlight" id="total-revenue">$0.00</p>
                </div>
                <div class="card stats-card">
                    <h3>Pending Bills</h3>
                    <p class="stat-number alert" id="pending-count">0</p>
                </div>
                <div class="card stats-card">
                    <h3>Processed Invoices</h3>
                    <p class="stat-number" id="processed-count">0</p>
                </div>

                <div class="card queue-card">
                    <div class="card-header-flex">
                        <h3>Patient Invoices</h3>
                    </div>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Token / Patient Name</th>
                                    <th>Services Rendered</th>
                                    <th>Amount</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="billing-body">
                                <!-- Populated by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
